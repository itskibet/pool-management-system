name: Backend CI

on:
  push:
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  php:
    name: PHP and Composer validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, json, pdo_mysql
          coverage: none

      - name: Validate Composer manifest
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find backend -path 'backend/vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
