name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  php:
    name: PHP validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, json, pdo_mysql
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find backend -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    name: Secret and configuration guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^e])$' | grep -v '^\.env\.example$'; then
            echo 'Potential environment secret file is tracked.'
            exit 1
          fi
          echo 'Environment file guard passed.'
