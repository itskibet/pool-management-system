name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify frontend files
        run: |
          test -f package.json
          echo "Frontend package.json found."
          echo "npm cache disabled for CI because frontend/package-lock.json is not committed."

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
